name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const key = process.env.CARTO_API_KEY?.trim();
          if (!key) {
            throw new Error('CARTO_API_KEY repository secret is required');
          }

          fs.mkdirSync('_site', { recursive: true });
          for (const file of ['index.html', 'manifest.json', 'parking_data.json', 'sw.js']) {
            fs.copyFileSync(file, `_site/${file}`);
          }
          fs.writeFileSync(
            '_site/config.js',
            `window.PARKING_CONFIG = Object.freeze({\n  cartoApiKey: ${JSON.stringify(key)},\n});\n`,
          );
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5